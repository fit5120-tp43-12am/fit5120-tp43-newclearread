project:
  name: clearread-llama31-8b-smoke
  description: Smoke-test preparation for ClearRead Llama 3.1 8B Instruct SFT + QLoRA.

model:
  base_model_id: unsloth/Llama-3.1-8B-Instruct-unsloth-bnb-4bit
  fallback_model_ids:
    - unsloth/Llama-3.1-8B-Instruct-bnb-4bit
    - meta-llama/Meta-Llama-3.1-8B-Instruct
  trust_remote_code: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: bf16_if_supported
  dtype: auto

data:
  smoke_path: data/splits/smoke_test_10.jsonl
  split_manifest_path: data/splits/split_manifest.json
  max_seq_length: 3072
  train_on_roles:
    - assistant
  mask_prompt_labels_with: -100

outputs:
  output_dir: outputs/smoke
  adapter_dir: models/adapters/smoke_llama31_8b_qlora
  smoke_log_path: logs/smoke_test_001.md
  mask_report_path: reports/LABEL_MASK_SANITY_CHECK.md
  prep_report_path: reports/SMOKE_TRAINING_PREP_REPORT.md

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  use_gradient_checkpointing: unsloth
  random_state: 5120
  use_rslora: false
  loftq_config: null

training:
  method: SFT
  tuning: QLoRA
  seed: 5120
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  effective_batch_size: 4
  max_steps: 20
  learning_rate: 0.0002
  warmup_steps: 2
  weight_decay: 0.01
  lr_scheduler_type: linear
  optim: adamw_8bit
  logging_steps: 1
  save_strategy: "no"
  report_to: []
  bf16: auto
  fp16: auto

progress:
  enabled: true
  log_elapsed_time: true
  log_average_seconds_per_step: true
  log_estimated_remaining_time: true
  log_estimated_completion_time: true
  print_every_steps: 1

inference:
  default_num_examples: 3
  max_new_tokens: 320
  temperature: 0.0
  do_sample: false

docs_checked:
  - https://unsloth.ai/docs/get-started/fine-tuning-llms-guide
  - https://huggingface.co/docs/trl/sft_trainer
