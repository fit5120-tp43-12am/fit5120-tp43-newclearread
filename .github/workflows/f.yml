name: Build and deploy frontend to Azure Web App - Clear-Read

on:
  push:
    branches:
      - deployment-test
    paths:
      - "frontend/**"
      - ".github/workflows/f.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node version
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL != '' && vars.VITE_API_BASE_URL || 'http://localhost:8000' }}
        run: npm run build

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_FRONTEND_APP_NAME != '' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: frontend-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1371CDFB2E0C47619D9A60FD1ED1C40E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9FA24E63FBF24C8C8A416CBFE888E909 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8165108704564A35B330E878B8D06B41 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_FRONTEND_APP_NAME }}
          slot-name: Production
          package: .

  deploy-skipped:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.AZURE_FRONTEND_APP_NAME == '' }}
    steps:
      - name: Explain why deploy is skipped
        run: |
          echo "Deploy skipped: repository variable AZURE_FRONTEND_APP_NAME is not configured yet."