# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - clearead

on:
  push:
    branches:
      - dev
      - Iteration-1-release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: Iteration-1-release
          path: release-src

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and build dev frontend
        working-directory: dev-src/frontend
        env:
          VITE_BASE_PATH: /underdevelopment/
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Install and build release frontend
        working-directory: release-src/frontend
        env:
          VITE_BASE_PATH: /version1/
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package/underdevelopment
          mkdir -p deploy-package/version1

          cp -R dev-src/frontend/dist/. deploy-package/underdevelopment/
          cp -R release-src/frontend/dist/. deploy-package/version1/

          cp dev-src/server.js deploy-package/server.js
          cat > deploy-package/package.json <<'EOF'
          {
            "name": "clearead-versioned-static-server",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "20.x"
            }
          }
          EOF

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_0E38A33546C04C3DA18F6DADA88CC503 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F7264AC7D21C4210B89C686CEB9EEDC7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_73C9A477303A4FB4A4E702752CA9A771 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'clearead'
          slot-name: 'Production'
          package: deploy-package
