# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - clearead

on:
  push:
    branches:
      - main
      - dev
      - Iteration-1-release
      - Iteration-2-release
      - Iteration-3-release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: Iteration-1-release
          path: release-src

      - name: Checkout Iteration-2-release branch
        uses: actions/checkout@v4
        with:
          ref: Iteration-2-release
          path: release2-src

      - name: Checkout Iteration-3-release branch
        uses: actions/checkout@v4
        with:
          ref: Iteration-3-release
          path: release3-src

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install and build main frontend
        working-directory: main-src/frontend
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Install and build dev frontend
        working-directory: dev-src/frontend
        env:
          VITE_BASE_PATH: /underdevelopment/
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Install and build release frontend
        working-directory: release-src/frontend
        env:
          VITE_BASE_PATH: /version1/
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Install and build Iteration-2-release frontend
        working-directory: release2-src/frontend
        env:
          VITE_BASE_PATH: /version2/
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Install and build Iteration-3-release frontend
        working-directory: release3-src/frontend
        env:
          VITE_BASE_PATH: /version3/
          VITE_API_BASE_URL: https://clear-read-a3c2gyajcjf5agfd.australiaeast-01.azurewebsites.net/
        run: |
          npm ci
          npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          mkdir -p deploy-package/underdevelopment
          mkdir -p deploy-package/version1
          mkdir -p deploy-package/version2
          mkdir -p deploy-package/version3

          cp -R main-src/frontend/dist/. deploy-package/
          cp -R dev-src/frontend/dist/. deploy-package/underdevelopment/
          cp -R release-src/frontend/dist/. deploy-package/version1/
          cp -R release2-src/frontend/dist/. deploy-package/version2/
          cp -R release3-src/frontend/dist/. deploy-package/version3/

          cp dev-src/server.js deploy-package/server.js
          cat > deploy-package/package.json <<'EOF'
          {
            "name": "clearead-versioned-static-server",
            "version": "1.0.0",
            "private": true,
            "scripts": {
              "start": "node server.js"
            },
            "engines": {
              "node": "20.x"
            }
          }
          EOF

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B825E790F1A544A981CEDF9DB9987904 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_224DE60E5C204EC295786F60C795955B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6E61493D47C740B48D0B8454B067A0B2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'clearead'
          slot-name: 'Production'
          package: deploy-package
