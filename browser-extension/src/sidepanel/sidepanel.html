<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clearead</title>
    <link rel="stylesheet" href="./sidepanel.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Clearead extension</p>
        <h1>Reading support</h1>
      </header>

      <section class="workspace" aria-labelledby="paste-heading">
        <div class="section-heading">
          <h2 id="paste-heading">Paste text</h2>
          <span id="text-count" class="count" aria-live="polite">0 words</span>
        </div>

        <label class="input-label" for="source-text">Text to review</label>
        <textarea
          id="source-text"
          class="text-input"
          rows="10"
          placeholder="Paste a paragraph here to prepare it for future simplify and summary tools."
        ></textarea>

        <div class="button-row">
          <button id="clear-text" class="secondary-button" type="button">Clear</button>
          <button id="preview-text" class="primary-button" type="button">Preview</button>
        </div>
      </section>

      <section class="result-panel" aria-labelledby="result-heading">
        <h2 id="result-heading">Placeholder result</h2>
        <p id="result-message" class="result-message">
          Paste text above to see the local placeholder state for future reading tools.
        </p>
      </section>
    </main>

    <script src="./sidepanel.js"></script>
  </body>
</html>
