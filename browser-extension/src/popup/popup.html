<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clearead</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <h1>Clearead</h1>
      <p class="popup-note">
        Start Clearead on the current page, then use reading tools from the side panel.
      </p>
      <button id="open-clearead" class="primary-button" type="button">
        Open Clearead for this page
      </button>
      <p id="popup-status" class="popup-status" role="status" aria-live="polite">
        Page tools run only after you click a tool.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
