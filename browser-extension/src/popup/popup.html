<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clearead</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <div class="popup-brand">
        <img
          class="popup-logo"
          src="../../public/icons/icon-32.png"
          alt=""
          aria-hidden="true"
        >
        <h1>Clearead</h1>
      </div>
      <p class="popup-note">
        Start Clearead on the current page, then use reading tools from the side panel.
      </p>
      <button id="open-clearead" class="primary-button" type="button">
        Open Clearead for this page
      </button>
      <a
        id="open-clearead-website"
        class="secondary-link"
        href="https://clearead.azurewebsites.net/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open website
      </a>
      <p id="popup-status" class="popup-status" role="status" aria-live="polite">
        Page tools run only after you click a tool.
      </p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
